<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>
<div class="filters">
  <input type="radio" name="filter" id="show-all" checked>
  <label for="show-all">All</label>

  <input type="radio" name="filter" id="show-fruit">
  <label for="show-fruit">Fruit</label>

  <input type="radio" name="filter" id="show-vegetable">
  <label for="show-vegetable">Vegetables</label>
</div>

<div class="items">
  <div class="item fruit">Apple</div>
  <div class="item vegetable">Carrot</div>
  <div class="item fruit">Banana</div>
  <div class="item vegetable">Broccoli</div>
</div>  
</body>
</html>
